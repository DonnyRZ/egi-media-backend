# Install as /etc/nginx/snippets/egi-media-cms-upload.conf and include inside
# the CMS HTTPS server block. The backend still enforces the 5 MiB file limit.
location = /api/v1/uploads {
    client_max_body_size 6m;
    client_body_timeout 120s;
    include /etc/nginx/snippets/egi-media-proxy.conf;
    proxy_send_timeout 135s;
    proxy_read_timeout 135s;
    proxy_pass http://127.0.0.1:5002;
    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/egi-media-upload-access.log egi_media_upload;
}
